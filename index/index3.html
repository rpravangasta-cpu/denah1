<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Navigasi Kampus - Blueprint Interaktif</title>
    <style>
        /* Variabel CSS */
        :root {
            --bg-color: #1a2639; /* Blueprint Dark Blue */
            --grid-line: #2c3e50;
            --room-bg: #24344d;
            --room-border: #bdc3c7;
            --text-color: #ecf0f1;
            --accent-color: #e74c3c; /* Red for destination */
            --route-color: #00d2d3; /* Cyan for route */
            --start-color: #2ecc71; /* Green for start */
            --panel-width: 300px; /* Lebar panel menu di desktop */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden; 
        }

        /* --- Main Layout: Map (Left/Main) & Menu (Right) --- */
        #map-area {
            flex-grow: 1;
            position: relative;
            overflow: hidden; /* Dikelola oleh map-container */
        }

        #control-panel {
            width: var(--panel-width);
            min-width: 200px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            padding: 15px;
            overflow-y: auto; /* Scroll pada panel menu */
            border-left: 1px solid var(--grid-line);
            z-index: 100;
        }
        
        /* Penyesuaian untuk Layar Mobile (Lebar < 768px) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #control-panel {
                width: 100%;
                height: 100px; /* Tinggi menu di mobile */
                border-left: none;
                border-bottom: 1px solid var(--grid-line);
            }
            #map-area { flex-grow: 1; height: calc(100vh - 100px); }
        }

        /* --- Header & Pilihan Ruangan --- */
        h1 { font-size: 1.2rem; margin-bottom: 15px; font-weight: 700; color: var(--route-color); }
        .room-option {
            padding: 10px;
            margin-bottom: 8px;
            background: var(--room-bg);
            border-radius: 4px;
            border: 1px solid var(--grid-line);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .room-option:hover { background: rgba(0, 210, 211, 0.1); border-color: var(--route-color); }
        .room-option.selected {
            background: var(--accent-color);
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }


        /* --- Map Container & Blueprint (Zoom/Geser) --- */
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: auto; 
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            cursor: grab;
        }

        #blueprint {
            position: relative;
            width: 1200px; 
            height: 800px;
            transform-origin: top left; 
            transition: transform 0.4s ease;
        }

        /* Rooms, Route, Info Bubble (Styling sama) */
        .room { position: absolute; background: var(--room-bg); border: 2px solid var(--room-border); color: var(--text-color); display: flex; justify-content: center; align-items: center; text-align: center; font-size: 11px; font-weight: 600; transition: all 0.3s; padding: 2px; z-index: 2; }
        .room.start { border-color: var(--start-color); color: var(--start-color); }
        .room.active { border-color: var(--accent-color); background: rgba(231, 76, 60, 0.2); color: var(--accent-color); box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); transform: scale(1.02); z-index: 10; }
        #route-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        path.route-line { fill: none; stroke: var(--route-color); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 3s linear forwards; filter: drop-shadow(0 0 5px var(--route-color)); }
        @keyframes dash { to { stroke-dashoffset: 0; } }
        #info-bubble { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; color: #ccc; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.5s; }
        #info-bubble.show { opacity: 1; }

        /* --- Zoom Controls --- */
        #zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .zoom-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: background 0.2s;
            line-height: 40px;
        }
        .zoom-btn:hover { background: rgba(0, 0, 0, 0.9); }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map-container">
        <div id="blueprint">
            <svg id="route-layer"></svg>
            </div>
    </div>
    
    <div id="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">-</button>
    </div>

    <div id="info-bubble"></div>
</div>

<div id="control-panel">
    <h1>Pilih Ruangan Tujuan</h1>
    <div id="room-list">
        </div>
</div>

<script>
    // --- KONFIGURASI GRID ---
    const U = 40; // 1 Unit Grid = 40px
    const OFF_X = 400; 
    const OFF_Y = 150;
    const MAP_WIDTH = 1200; 
    const MAP_HEIGHT = 800;
    
    // --- DATABASE RUANGAN ---
    const roomsData = [
        { id: 'cafe', name: 'Cafe', w: 1, h: 2, x: -4, y: 0, door: 's' },
        { id: 'feb', name: 'R. FEB', w: 3, h: 2, x: -3, y: 0, door: 's' },
        { id: 'pertemuan', name: 'R. Pertemuan (Start)', w: 3, h: 2, x: 0, y: 0, door: 's', isStart: true },
        { id: 'r7', name: 'R. 7', w: 4, h: 2, x: 3, y: 0, door: 's' },
        { id: 'r8', name: 'R. 8', w: 3, h: 2, x: 7, y: 0, door: 's' },
        { id: 'r9', name: 'R. 9', w: 3, h: 2, x: 10, y: 0, door: 's' },
        { id: 'r10', name: 'R. 10', w: 3, h: 2, x: 13, y: 0, door: 's' },
        { id: 'dosen_feb', name: 'R. Dosen FEB', w: 2, h: 2, x: 16, y: 0, door: 's' },
        { id: 'r1', name: 'R. 1', w: 2, h: 3, x: -3, y: 2, door: 'e' },
        { id: 'r2', name: 'R. 2', w: 2, h: 3, x: -3, y: 5, door: 'e' },
        { id: 'r3', name: 'R. 3', w: 2, h: 3, x: -3, y: 9, door: 'e' }, 
        { id: 'r4', name: 'R. 4', w: 2, h: 3, x: -3, y: 12, door: 'e' },
        { id: 'r5', name: 'R. 5', w: 5, h: 2, x: -3, y: 15, door: 'n' },
        { id: 'r6', name: 'R. 6', w: 5, h: 2, x: 2, y: 15, door: 'n' },
        { id: 'pgri', name: 'R. PGRI', w: 2, h: 2, x: 7, y: 15, door: 'w' }, 
        { id: 'smk', name: 'R. SMK', w: 2, h: 9, x: 7, y: 6, door: 'w' },
        { id: 'wr3', name: 'R. WR 3', w: 2, h: 2, x: 7, y: 3, door: 'w' },
        { id: 'perpus', name: 'Perpus', w: 2, h: 3, x: 16, y: -3, door: 'e' },
        { id: 'mushola', name: 'Mushola', w: 4, h: 4, x: 14, y: -7, door: 'e' },
        { id: 'r11', name: 'R. 11', w: 2, h: 3, x: 21, y: -7, door: 'w' },
        { id: 'r12', name: 'R. 12', w: 2, h: 3, x: 21, y: -4, door: 'w' },
        { id: 'r13', name: 'R. 13', w: 2, h: 3, x: 21, y: -1, door: 'w' },
        { id: 'wr1', name: 'R. WR 1', w: 3, h: 2, x: 20, y: 2, door: 'w' },
    ];

    // --- INISIALISASI DOM & STATE ---
    const blueprint = document.getElementById('blueprint');
    const mapContainer = document.getElementById('map-container');
    const roomList = document.getElementById('room-list');
    const infoBubble = document.getElementById('info-bubble');
    const svgLayer = document.getElementById('route-layer');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');

    let simulationInterval = null;
    let currentScale = 1.0; 

    // --- FUNGSI SCALING & ZOOM ---
    function applyScale(scale) {
        currentScale = Math.max(0.2, Math.min(5.0, scale)); // Batasan zoom
        blueprint.style.transform = `scale(${currentScale})`;
    }

    function adjustScaleToFit() {
        const containerWidth = mapContainer.clientWidth;
        const containerHeight = mapContainer.clientHeight;
        
        let scaleX = containerWidth / MAP_WIDTH;
        let scaleY = containerHeight / MAP_HEIGHT;
        let scaleFactor = Math.min(scaleX, scaleY) * 0.95; 

        applyScale(scaleFactor);

        // Scroll ke tengah setelah scale
        const scaledWidth = MAP_WIDTH * currentScale;
        const scaledHeight = MAP_HEIGHT * currentScale;

        mapContainer.scrollLeft = (scaledWidth - containerWidth) / 2;
        mapContainer.scrollTop = (scaledHeight - containerHeight) / 2;
    }

    // --- FUNGSI ZOOM MANUAL ---
    zoomInBtn.addEventListener('click', () => {
        applyScale(currentScale + 0.2);
    });

    zoomOutBtn.addEventListener('click', () => {
        applyScale(currentScale - 0.2);
    });


    // --- RENDERING & INISIALISASI ---
    function initializeMap() {
        roomsData.forEach(room => {
            // 1. Render Ruangan pada Blueprint
            const div = document.createElement('div');
            div.className = `room ${room.isStart ? 'start' : ''}`;
            div.id = `room-${room.id}`;
            div.innerText = room.name;
            
            div.style.width = (room.w * U) + 'px';
            div.style.height = (room.h * U) + 'px';
            div.style.left = (OFF_X + room.x * U) + 'px';
            div.style.top = (OFF_Y + room.y * U) + 'px';

            blueprint.appendChild(div);

            // 2. Buat Opsi Pilihan di Panel (Kecuali Ruang Start)
            if (!room.isStart) {
                const opt = document.createElement('div');
                opt.className = 'room-option';
                opt.dataset.roomId = room.id;
                opt.innerText = room.name;
                roomList.appendChild(opt);
            }
        });

        // Terapkan Scaling Awal yang Optimal
        adjustScaleToFit();
    }


    // --- ALGORITMA RUTE (Sama seperti sebelumnya) ---
    function getDoorCoordinates(roomId) {
        const r = roomsData.find(rm => rm.id === roomId);
        if(!r) return null;
        let px = OFF_X + r.x * U;
        let py = OFF_Y + r.y * U;
        let w = r.w * U;
        let h = r.h * U;
        let dx, dy;
        switch(r.door) {
            case 's': dx = px + w/2; dy = py + h; break; 
            case 'n': dx = px + w/2; dy = py; break;     
            case 'e': dx = px + w; dy = py + h/2; break; 
            case 'w': dx = px; dy = py + h/2; break;     
            default:  dx = px + w/2; dy = py + h;
        }
        return { x: dx, y: dy, dir: r.door };
    }

    function calculatePath(targetId) {
        const start = getDoorCoordinates('pertemuan');
        const end = getDoorCoordinates(targetId);
        if(!start || !end) return "";
        let path = `M ${start.x} ${start.y}`; 
        const hallwayOffset = 40; 
        const mainHallwayY = start.y + hallwayOffset; 
        path += ` L ${start.x} ${mainHallwayY}`; 
        let targetHallwayX = end.x;
        if(end.dir === 'e') targetHallwayX += hallwayOffset/2; 
        if(end.dir === 'w') targetHallwayX -= hallwayOffset/2;
        path += ` L ${targetHallwayX} ${mainHallwayY}`;
        path += ` L ${targetHallwayX} ${end.y}`;
        path += ` L ${end.x} ${end.y}`;
        return path;
    }

    // --- FUNGSI SIMULASI ---
    function startSimulation(targetId) {
        // Hapus highlight lama
        document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
        document.querySelectorAll('.room-option').forEach(r => r.classList.remove('selected'));
        
        // Highlight tujuan pada denah dan list
        const targetRoomEl = document.getElementById(`room-${targetId}`);
        const targetOptionEl = document.querySelector(`.room-option[data-room-id="${targetId}"]`);
        
        if(targetRoomEl) targetRoomEl.classList.add('active');
        if(targetOptionEl) targetOptionEl.classList.add('selected');

        const d = calculatePath(targetId);
        svgLayer.innerHTML = '';
        const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathEl.setAttribute("d", d);
        pathEl.setAttribute("class", "route-line");
        svgLayer.appendChild(pathEl);

        infoBubble.innerText = `Rute ke ${targetRoomEl.innerText} aktif. Mengulang tiap 5 detik.`;
        infoBubble.classList.add('show');
    }

    // --- EVENT LISTENERS ---
    roomList.addEventListener('click', (e) => {
        if (e.target.classList.contains('room-option')) {
            const targetId = e.target.dataset.roomId;
            
            if (simulationInterval) clearInterval(simulationInterval);

            // Jalankan simulasi pertama
            startSimulation(targetId);

            // Loop simulasi setiap 5 detik
            simulationInterval = setInterval(() => {
                svgLayer.innerHTML = '';
                setTimeout(() => {
                    startSimulation(targetId);
                }, 100); 
            }, 5000);
        }
    });
    
    // Panggil saat halaman dimuat
    window.onload = initializeMap;
    
    // Panggil saat ukuran jendela berubah (untuk penyesuaian scale)
    window.onresize = adjustScaleToFit;

</script>
</body>
</html>
